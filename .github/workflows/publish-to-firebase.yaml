name: Deploy to Firebase

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "firebase"
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      GOOGLE_SHEETS_READER_SA: ${{ secrets.GOOGLE_SHEETS_READER_SA }}
      GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
      MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

  publish-to-firebase:
    runs-on: ubuntu-latest
    needs:
      - build
      - validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: github-pages

      - run: |
          mkdir -p _site
          tar -C _site -xv -f artifact.tar
          ls -l

      - run: npm install
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: caara-races
