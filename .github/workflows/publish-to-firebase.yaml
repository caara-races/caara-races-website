# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

concurrency:
  group: "firebase-preview"
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - run: npm install && npm run build
      - name: Write google sheets secret to file
        env:
          GOOGLE_SHEETS_READER_SA: ${{ secrets.GOOGLE_SHEETS_READER_SA }}
        run: |
          echo "$GOOGLE_SHEETS_READER_SA" | base64 --decode > google-sheets-creds.json
        shell: bash
      - name: Install packages
        run: |
          npm install
      - name: Fetch data
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: google-sheets-creds.json
        run: |
          npm run fetch
      - name: Build pages
        run: |
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAARA_RACES }}
          channelId: live
          projectId: caara-races
