# https://github.com/firebase/firebase-tools

name: Deploy preview to Firebase
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: "firebase"
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      GOOGLE_SHEETS_READER_SA: ${{ secrets.GOOGLE_SHEETS_READER_SA }}
      GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
      MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

  preview-to-firebase:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs:
      - build
      - validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: github-pages

      - run: |
          mkdir -p _site
          tar -C _site -xv -f artifact.tar
          ls -l

      - run: npm install
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: caara-races
