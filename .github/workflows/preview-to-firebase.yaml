# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: "firebase-publish"
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - name: Write google sheets secret to file
        env:
          GOOGLE_SHEETS_READER_SA: ${{ secrets.GOOGLE_SHEETS_READER_SA }}
        run: |
          echo "$GOOGLE_SHEETS_READER_SA" | base64 --decode > google-sheets-creds.json
        shell: bash
      - name: Install packages
        run: |
          npm install
      - name: Fetch data
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: google-sheets-creds.json
        run: |
          npm run fetch
      - name: Build pages
        run: |
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAARA_RACES }}
          projectId: caara-races
