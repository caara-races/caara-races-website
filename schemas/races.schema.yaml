$schema: http://json-schema.org/draft-07/schema#
$id: caara-races/race
description: >-
  CAARA race document
type: object
properties:
  title:
    type: string
    description: The name of the race.
    examples:
      - Fool's Dual
      - Town and Country
  date:
    description: The race date and start time.
    $ref: "#/definitions/iso8601date"
  race:
    description: >-
      Race metadata
    $ref: "#/definitions/race"
required:
  - date
  - race
  - title
definitions:
  coordinates:
    description: >-
      Geographic coordinates as a latitude,longitude tuple.
    type: string
    pattern: ^[+-]?[0-9]+(\.[0-9]+)?,\s*[+-]?[0-9]+(\.[0-9]+)?$
    examples:
      - 42.491789,-70.847104
  iso8601date:
    description: |-
      A date and time in [ISO8601] format.

      [iso8601]: https://en.wikipedia.org/wiki/ISO_8601
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$
    examples:
      - "2026-05-09T08:00:00-04:00"
      - "2026-09-13T09:00:00-04:00"
  url:
    description: >-
      An http or https url
    type: string
    pattern: ^https?://
  location:
    type: object
    description: >-
      A geographic location. Addresses will be geocoded, or you can
      provide explicit coordinates.
    examples:
      - name: Good Harbor Beach
        address: |-
          100 Thatcher Road
          Gloucester, MA
        coordinates: 42.620615, -70.632187
    additionalProperties: false
    properties:
      name:
        type: string
        description: >-
          A human-readable name for the location (e.g., "Marblehead High School").
          If omitted, a default is used: "Start" for the start location, "Finish"
          for the finish location, or the checkpoint key (e.g., "cp1") for checkpoints.
      address:
        type: string
        description: >-
          The intersection or street address of the location, including town and state.
          We feed this to Google's geocoding API to discover the geographic coordinates
          of the location.
        examples:
          - Washington St & Reynard St, Gloucester, MA
      notes:
        type: string
        description: >-
          Additional information about the location
        examples:
          - Mile 1 and 13
      coordinates:
        description: >-
          Explicit geographic coordinates for the location. This allows us to set an explicit
          location if Google's geocoding API fails to find the correct location.
        $ref: "#/definitions/coordinates"
    required:
      - address
  repeaters:
    type: object
    description: >-
      References to repeater information in contents/_data/repeaters.yaml.
    examples:
      - primary: ns1ra-salem
        backup: ns1ra-danvers
    additionalProperties: false
    properties:
      primary:
        type: string
        description: >-
          Primary communication channel.
      backup:
        type: string
        description: >-
          Secondary communication channel.
    required:
      - primary
  race:
    type: object
    additionalProperties: false
    properties:
      towns:
        type: array
        items:
          type: string
        description: >-
          A list of towns through which the race will run. This is used to generate
          the list of emergency contact numbers.
      checkpoints:
        type: object
        description: >-
          Contains location information for each checkpoint in the race.
        additionalProperties:
          $ref: "#/definitions/location"
      sheet:
        description: >-
          URL to the google sheet with staffing information. If this is not set
          we will find the sheet URL in a parent directory.
        $ref: "#/definitions/url"
      start:
        description: >-
          Location of the race starting point.
        $ref: "#/definitions/location"
      finish:
        description: >-
          Location of the race finish.
        $ref: "#/definitions/location"
      url:
        description: >-
          URL to the YuKanRun page for this race.
        $ref: "#/definitions/url"
      repeaters:
        description: >-
          Information about the repeaters that will be used for the race.
        $ref: "#/definitions/repeaters"
    required:
      - start
      - repeaters
