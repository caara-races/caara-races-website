$schema: http://json-schema.org/draft-07/schema#
definitions:
  location:
    type: object
    additionalProperties: false
    properties:
      name:
        type: string
        description: >-
          A human-readable name for the location (e.g., "Marblehead High School").
          If omitted, a default is used: "Start" for the start location, "Finish"
          for the finish location, or the checkpoint key (e.g., "cp1") for checkpoints.
      address:
        type: string
        description: >-
          The intersection or street address of the location, including town and state.
          We feed this to Google's geocoding API to discover the geographic coordinates
          of the location.
        examples:
          - Washington St & Reynard St, Gloucester, MA
      position:
        type: string
        description: >-
          Mile position along the course.
        examples:
          - Mile 1 and 13
      coordinates:
        type: string
        description: >-
          Explicit geographic coordinates for the location. This allows us to set an explicit
          location if Google's geocoding API fails to find the correct location.
        examples:
          - 42.491789, -70.847104
    required:
      - address
type: object
properties:
  title:
    type: string
    description: The name of the race.
    examples:
      - Fool's Dual
      - Town and Country
  date:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$
    description: The race date and start time as an ISO8601 date string, including timezone.
    examples:
      - "2026-05-09T08:00:00-04:00"
      - "2026-09-13T09:00:00-04:00"
  race:
    type: object
    additionalProperties: false
    properties:
      towns:
        type: array
        items:
          type: string
        description: >-
          A list of towns through which the race will run. This is used to generate
          the list of emergency contact numbers.
      checkpoints:
        type: object
        description: >-
          Contains location information for each checkpoint in the race.
        additionalProperties:
          $ref: '#/definitions/location'
      sheet:
        type: string
        description: >-
          URL to the google sheet with staffing information.
      start:
        description: >-
          Location of the race starting point.
        $ref: '#/definitions/location'
      finish:
        description: >-
          Location of the race finish.
        $ref: '#/definitions/location'
      url:
        type: string
        pattern: ^https?://
        description: >-
          URL to the YuKanRun page for this race.
      frequency:
        type: object
        description: >-
          Information about the repeaters that will be used for the race. The values reference
          the data in content/_data/repeaters.yaml.
        examples:
          - primary: ns1ra-salem
            backup: ns1ra-danvers
        additionalProperties: false
        properties:
          primary:
            type: string
          backup:
            type: string
    required:
      - start
      - frequency
required:
  - date
  - race
  - title
