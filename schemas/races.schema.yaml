$schema: http://json-schema.org/draft-07/schema#
$id: caara-races/race
description: >-
  CAARA race document
type: object
properties:
  title:
    type: string
    description: The name of the race.
    examples:
      - Fool's Dual
      - Town and Country
  date:
    description: The race date and start time.
    $ref: "#/definitions/iso8601date"
  race:
    description: >-
      Race metadata
    $ref: "#/definitions/race"
required:
  - date
  - race
  - title
definitions:
  coordinates:
    $ref: "common.yaml#/definitions/coordinates"
  iso8601date:
    description: |-
      A date and time in [ISO8601] format.

      [iso8601]: https://en.wikipedia.org/wiki/ISO_8601
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$
    examples:
      - "2026-05-09T08:00:00-04:00"
      - "2026-09-13T09:00:00-04:00"
  url:
    description: >-
      An http or https url
    type: string
    pattern: ^https?://
  location:
    $ref: "common.yaml#/definitions/location"
  repeaters:
    type: object
    description: >-
      References to repeater information in contents/_data/repeaters.yaml.
    examples:
      - primary: ns1ra-salem
        backup: ns1ra-danvers
    additionalProperties: false
    properties:
      primary:
        type: string
        description: >-
          Primary communication channel.
      backup:
        type: string
        description: >-
          Secondary communication channel.
    required:
      - primary
  race:
    type: object
    additionalProperties: false
    properties:
      towns:
        type: array
        items:
          type: string
        description: >-
          A list of towns through which the race will run. This is used to generate
          the list of emergency contact numbers.
      checkpoints:
        type: object
        description: >-
          Contains location information for each checkpoint in the race.
        additionalProperties:
          $ref: "#/definitions/location"
      sheet:
        description: >-
          URL to the google sheet with staffing information. If this is not set
          we will find the sheet URL in a parent directory.
        $ref: "#/definitions/url"
      start:
        description: >-
          Location of the race starting point.
        $ref: "#/definitions/location"
      finish:
        description: >-
          Location of the race finish.
        $ref: "#/definitions/location"
      url:
        description: >-
          URL to the YuKanRun page for this race.
        $ref: "#/definitions/url"
      repeaters:
        description: >-
          Information about the repeaters that will be used for the race.
        $ref: "#/definitions/repeaters"
    required:
      - start
      - repeaters
