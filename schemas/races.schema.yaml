$schema: http://json-schema.org/draft-04/schema#
type: object
properties:
  title:
    type: string
  date:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}$
  race:
    type: object
    additionalProperties: false
    properties:
      towns:
        type: array
        items:
          type: string
      checkpoints:
        type: object
        additionalProperties:
          type: object
          properties:
            address:
              type: string
            position:
              type: string
            coordinates:
              type: string
          required:
            - address
            - position
      sheet:
        type: string
      location:
        type: object
        properties:
          name:
            type: string
          address:
            type: string
          coordinates:
            type: string
        required:
          - name
          - address
      url:
        type: string
        pattern: ^https?://
      want:
        type: integer
      frequency:
        type: object
        additionalProperties: false
        properties:
          primary:
            type: string
          backup:
            type: string
    required:
      - location
      - frequency
required:
  - date
  - race
  - title
